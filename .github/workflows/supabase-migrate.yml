# TEMPORARY: one-off, manually triggered deployment of the existing Supabase
# migrations to the linked project with the standard Supabase CLI. Remove this
# workflow once the migrations have been deployed.
name: Supabase migrate (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight: read-only aggregate check of existing data for the pending migration. dry-run: validate and show the migration plan only. apply: re-run every check, then push."
        required: true
        type: choice
        options:
          - preflight
          - dry-run
          - apply

permissions:
  contents: read

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      EXPECTED_MIGRATIONS: |
        20261003000001_foundations.sql
        20261003000002_profiles.sql
        20261003000003_tags.sql
        20261003000004_analyses.sql
        20261003000005_case_studies.sql
        20261003000006_content_tags.sql
        20261003000007_orders.sql
        20261003000008_storage.sql
        20261004000009_storage_restrict_listing.sql
        20261008000010_articles.sql
        20261009000011_order_hardening.sql
      # Migrations 1-10 are already recorded remotely, so the push plan must
      # contain only these.
      PENDING_MIGRATIONS: |
        20261009000011_order_hardening.sql
      # Read-only, aggregate-only data check for the pending migration. The
      # file must match this reviewed SHA-256 exactly; changing the query
      # means reviewing it and updating the hash here in the same change.
      PREFLIGHT_SQL: supabase/checks/20261009000011_order_hardening_preflight.sql
      PREFLIGHT_SHA256: d05c1d0326ed1772a4acd9d9c780e88bc14c006f7e73c21319c75859c9c1ad61
      # Counts that must all be 0 before the migration may be applied.
      PREFLIGHT_BLOCKING: duplicate_transaction_groups orders_with_duplicate_transaction customer_name_over_120 customer_email_over_254 bkash_number_over_32 transaction_number_over_40
    steps:
      - name: Validate mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            preflight|dry-run|apply) echo "Mode: $MODE" ;;
            *) echo "::error::Mode must be \"preflight\", \"dry-run\" or \"apply\"."; exit 1 ;;
          esac

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Verify migration directory contains exactly the expected files
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_MIGRATIONS" | sed '/^$/d' | LC_ALL=C sort)"
          actual="$(find supabase/migrations -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::supabase/migrations does not contain exactly the 11 expected migration files."
            diff <(echo "$expected") <(echo "$actual") || true
            exit 1
          fi
          echo "Migration directory matches the expected 11 files."

      - name: Verify the preflight query is the reviewed, single read-only SELECT
        if: inputs.mode == 'preflight'
        run: |
          set -euo pipefail
          echo "$PREFLIGHT_SHA256  $PREFLIGHT_SQL" | sha256sum --check --strict -
          # Comments removed, whitespace collapsed, lower-case.
          body="$(sed -e 's/--.*$//' "$PREFLIGHT_SQL" | tr '\n' ' ' | tr -s ' ' | tr '[:upper:]' '[:lower:]')"
          case "$body" in
            " with "*|"with "*|" select "*|"select "*) ;;
            *) echo "::error::Preflight must start with SELECT or WITH."; exit 1 ;;
          esac
          if [ "$(printf '%s' "$body" | tr -cd ';' | wc -c)" -ne 1 ] || ! printf '%s' "$body" | grep -qE ';[[:space:]]*$'; then
            echo "::error::Preflight must be exactly one statement."; exit 1
          fi
          if printf '%s' "$body" | grep -qwE 'insert|update|delete|merge|alter|drop|create|grant|revoke|truncate|copy|call|do|set|reset|lock|vacuum|analyze|comment|security|execute|prepare|listen|notify|begin|commit|rollback|into|share|nowait'; then
            echo "::error::Preflight contains a non-read-only keyword."; exit 1
          fi
          # Functions with side effects (sequences, sessions, locks, files, remote calls, settings).
          if printf '%s' "$body" | grep -qE '(nextval|setval|set_config|pg_terminate_backend|pg_cancel_backend|pg_advisory|pg_sleep|pg_read|pg_write|pg_file|pg_reload|pg_switch|pg_create|pg_drop|pg_promote|lo_[a-z]+|dblink|http_[a-z]+|net\.)[[:space:]]*\('; then
            echo "::error::Preflight calls a function with side effects."; exit 1
          fi
          echo "Preflight query is a single read-only SELECT."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.119.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Run read-only preflight (aggregate counts only)
        if: inputs.mode == 'preflight'
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/preflight.json"
          # Aggregate counts only (no row data); stderr carries just CLI progress.
          supabase db query --linked --output-format json --file "$PREFLIGHT_SQL" > "$result"
          # Strict, fail-closed parsing. Accepted result structures: a top-level
          # array of rows (linked Management API) or an object whose "rows" is
          # that array (direct database connection; extra keys "boundary" and
          # "warning" only). Exactly one row, exactly the expected columns, every
          # value a non-negative whole number (JSON integer, or a string of
          # digits, since bigint counts may be serialised as strings). The raw
          # result is never printed: jq's own messages are discarded and only
          # our fixed "preflight:" reasons or the validated counts are shown.
          filter='
            def expected: ["bkash_number_over_32", "customer_email_over_254", "customer_name_over_120",
              "duplicate_transaction_groups", "orders_not_yet_normalised", "orders_with_duplicate_transaction",
              "rate_limit_table_already_present", "total_orders", "transaction_number_over_40",
              "unique_index_already_present"];
            def count:
              if type == "number" and . >= 0 and . == floor and . <= 1000000000000000 then .
              elif type == "string" and test("^(0|[1-9][0-9]{0,14})$") then tonumber
              else error("preflight: a count is missing, negative, non-integer or not a number") end;
            (if type == "array" then .
             elif type == "object" and has("rows") and ((keys - ["boundary", "rows", "warning"]) == []) then .rows
             else error("preflight: unexpected result structure") end) as $rows
            | if ($rows | type) != "array" then error("preflight: unexpected result structure")
              elif ($rows | length) != 1 then error("preflight: expected exactly one result row")
              else $rows[0] end
            | if type != "object" then error("preflight: the result row is not an object")
              elif (keys != expected) then error("preflight: missing or unexpected columns")
              else . end
            | with_entries(.value |= count)
            | to_entries[] | "\(.key)=\(.value)"'
          if ! counts="$(jq -r "$filter" "$result" 2>"$RUNNER_TEMP/jq.err")"; then
            reason="$(grep -oE 'preflight: [a-z ,-]+' "$RUNNER_TEMP/jq.err" | head -n 1 || true)"
            echo "::error::${reason:-preflight: the result is not valid JSON in an expected structure}. Failing closed; do not apply the migration."
            exit 1
          fi
          if [ -z "$counts" ]; then
            echo "::error::preflight: the result is empty. Failing closed; do not apply the migration."
            exit 1
          fi
          echo "Preflight counts (aggregate only):"
          printf '  %s\n' $counts
          blocked=0
          for key in $PREFLIGHT_BLOCKING; do
            value="$(printf '%s\n' $counts | sed -n "s/^${key}=//p")"
            if [ -z "$value" ]; then echo "::error::preflight: blocking count ${key} is missing. Failing closed."; exit 1; fi
            if [ "$value" != "0" ]; then echo "::error::Preflight: ${key} = ${value} (must be 0). Do not apply the migration."; blocked=1; fi
          done
          if [ "$blocked" -ne 0 ]; then exit 1; fi
          echo "Preflight passed: no conflicting orders. Nothing was changed and no migration was pushed."

      - name: Show migration history before push
        if: inputs.mode != 'preflight'
        run: supabase migration list --linked

      - name: Dry run and verify the migration plan
        if: inputs.mode != 'preflight'
        run: |
          set -euo pipefail
          supabase db push --linked --dry-run 2>&1 | tee "$RUNNER_TEMP/dry-run.log"
          expected="$(printf '%s' "$PENDING_MIGRATIONS" | sed '/^$/d' | LC_ALL=C sort)"
          planned="$(grep -oE '[0-9]{14}_[A-Za-z0-9_]+\.sql' "$RUNNER_TEMP/dry-run.log" | LC_ALL=C sort -u || true)"
          if [ "$expected" != "$planned" ]; then
            echo "::error::Dry-run plan does not contain exactly the expected pending migrations."
            diff <(echo "$expected") <(echo "$planned") || true
            exit 1
          fi
          echo "Dry-run plan matches the expected pending migrations."

      - name: Dry-run complete
        if: inputs.mode == 'dry-run'
        run: |
          echo "Dry-run mode: all checks passed. No migrations were pushed."

      - name: Push migrations
        if: inputs.mode == 'apply'
        run: supabase db push --linked --yes

      - name: Verify remote migration history
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 | tee "$RUNNER_TEMP/after.log"
          missing=0
          while read -r file; do
            [ -z "$file" ] && continue
            version="${file%%_*}"
            # A row whose Local and Remote columns both show the version.
            if grep -qE "${version}.*${version}" "$RUNNER_TEMP/after.log"; then
              echo "Recorded remotely: ${file}"
            else
              echo "::error::Not recorded in remote history: ${file}"
              missing=1
            fi
          done <<< "$EXPECTED_MIGRATIONS"
          exit "$missing"
